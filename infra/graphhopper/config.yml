# GraphHopper config for Seshat — car / bike / foot with SRTM elevation + surface.
# Format is GraphHopper v11 (custom_model_files + encoded values, not the old
# vehicle:/weighting: style). datareader.file + graph.location come from -D flags
# in the compose command. Image: israelhikingmap/graphhopper (no official image exists).
graphhopper:
  datareader.file: ""
  graph.location: /data/graph-cache

  profiles:
    - name: car
      custom_model_files: [car.json]
    - name: bike
      custom_model_files: [bike.json, bike_elevation.json]
    - name: foot
      custom_model_files: [foot.json, foot_elevation.json]

  # Speed mode (CH) only for car; bike/foot run flexible (cheaper prep, RAM-friendly).
  profiles_ch:
    - profile: car
  profiles_lm: []

  # Encoded values required by the built-in bike/foot/elevation custom models.
  # surface + road_class are listed so the api can request them as path details
  # (this is what drives the route's surface colouring).
  graph.encoded_values: road_class, road_environment, max_speed, road_access, surface, smoothness, roundabout, average_slope, car_access, car_average_speed, bike_access, bike_average_speed, bike_priority, bike_network, foot_access, foot_average_speed, foot_priority, hike_rating, mtb_rating, country

  # Elevation (SRTM) — cached on the mounted volume so it survives restarts.
  graph.elevation.provider: srtm
  graph.elevation.cache_dir: /data/srtm-cache
  graph.elevation.dataaccess: RAM_STORE

  graph.dataaccess.default_type: RAM_STORE
  # Keep footway/cycleway/path so bike + foot can route (default drops them).
  import.osm.ignored_highways: ""

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0
