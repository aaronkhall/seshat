# Seshat — Coolify deploy stack (web + api).
# web (nginx) serves the SPA and proxies /api to the api container, so tile keys
# stay server-side and there's no CORS. Routing uses public OSRM worldwide.
#
# Self-hosted GraphHopper (SE-QLD, native elevation + surface) is a SEPARATE stack
# in docker-compose.graphhopper.yml — kept out of the default deploy because it needs
# more RAM headroom than the current VM has. Bring it up alongside once RAM allows,
# then set GRAPHHOPPER_URL/GRAPHHOPPER_BBOX on the api. See infra/README.md.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_PORT: 8787
      THUNDERFOREST_API_KEY: ${THUNDERFOREST_API_KEY:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      # Empty -> public OSRM worldwide. Point at a running GraphHopper to enable hybrid.
      GRAPHHOPPER_URL: ${GRAPHHOPPER_URL:-}
      GRAPHHOPPER_BBOX: ${GRAPHHOPPER_BBOX:-}
    # Homelab firewall blocks public DNS; use LAN Technitium resolvers for OSRM +
    # elevation egress. See references/homelab-dns.md.
    dns:
      - 192.168.3.10
      - 192.168.3.40
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "8091:80"
    restart: unless-stopped
