# Seshat — local/Coolify multi-service stack.
# The web container (nginx) serves the SPA and proxies /api to the api container,
# so tile API keys never leave the server and there are no CORS issues.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_PORT: 8787
      THUNDERFOREST_API_KEY: ${THUNDERFOREST_API_KEY:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      # Empty -> api uses keyless public OSRM. Set to the graphhopper service for
      # native elevation + surface (start it with: docker compose --profile routing up).
      GRAPHHOPPER_URL: ${GRAPHHOPPER_URL:-}
    restart: unless-stopped

  # Self-hosted routing. Off by default (heavy). Enable with --profile routing once
  # you've placed an OSM extract at infra/graphhopper/data/region.osm.pbf (see infra/README.md).
  graphhopper:
    image: graphhopper/graphhopper:latest
    profiles: ["routing"]
    command: >
      --input /data/region.osm.pbf
      --config /data/config.yml
      --host 0.0.0.0
    volumes:
      - ./infra/graphhopper/config.yml:/data/config.yml:ro
      - ./infra/graphhopper/data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
